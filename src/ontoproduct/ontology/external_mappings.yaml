# URI references and project-authored notes, not copied ontology axioms.
sources:
  iof:
    url: https://raw.githubusercontent.com/iofoundry/ontology/master/core/Core.rdf
    version: "202603 (owl:versionIRI)"
    license: MIT
    license_url: https://github.com/iofoundry/ontology/blob/master/LICENSE
    attribution: IOF Core Working Group / Industrial Ontologies Foundry / Open Applications Group
    verified_on: "2026-10-07"
  goodrelations:
    url: https://www.heppnetz.de/ontologies/goodrelations/v1.html
    version: "1.0, release 2011-10-01"
    license: CC-BY-3.0
    license_url: https://creativecommons.org/licenses/by/3.0/
    attribution: Martin Hepp, GoodRelations ontology
    verified_on: "2026-10-07"
  qudt:
    url: https://qudt.org/vocab/unit/
    version: "3.5.2 (unit pages rdfs:isDefinedBy)"
    license: CC-BY-4.0
    license_url: https://github.com/qudt/qudt-public-repo/blob/main/LICENSE.md
    attribution: QUDT.org
    verified_on: "2026-10-07"
mappings:
  physical_artifact:
    source: iof
    uri: https://spec.industrialontologies.org/ontology/construct/MaterialArtifact
    relation: reference
    status: verified
    note: Design reference for physical manufactured items; not equivalent to this system's product model records.
  organization:
    source: iof
    uri: https://spec.industrialontologies.org/ontology/construct/Organization
    relation: reference
    status: verified
    note: Design reference for organizations; no imported axioms or asserted equivalence.
  product_model:
    source: goodrelations
    uri: http://purl.org/goodrelations/v1#ProductOrServiceModel
    relation: reference
    status: verified
    note: Reference for model-level records, not physical individuals or a BLDCMotor definition.
  manufacturer:
    source: goodrelations
    uri: http://purl.org/goodrelations/v1#hasManufacturer
    relation: reference
    status: verified
    note: Relationship to a BusinessEntity; scalar manufacturer strings are not equivalent to this object property.
  manufacturer_entity:
    source: goodrelations
    uri: http://purl.org/goodrelations/v1#BusinessEntity
    relation: reference
    status: verified
    note: Reference for a manufacturer entity, not a direct mapping of its scalar name.
  V:
    source: qudt
    uri: http://qudt.org/vocab/unit/V
    relation: unit
    status: verified
    note: Volt; local electric_potential unit.
  W:
    source: qudt
    uri: http://qudt.org/vocab/unit/W
    relation: unit
    status: verified
    note: Watt; local power canonical unit.
  kW:
    source: qudt
    uri: http://qudt.org/vocab/unit/KiloW
    relation: unit
    status: verified
    note: Kilowatt; local multiplier to W is 1000.
  kg:
    source: qudt
    uri: http://qudt.org/vocab/unit/KiloGM
    relation: unit
    status: verified
    note: Kilogram; local mass canonical unit.
  g:
    source: qudt
    uri: http://qudt.org/vocab/unit/GM
    relation: unit
    status: verified
    note: Gram; local multiplier to kg is 0.001.
  mm:
    source: qudt
    uri: http://qudt.org/vocab/unit/MilliM
    relation: unit
    status: verified
    note: Millimetre; local canonical is mm, not the QUDT metre reference.
  rpm:
    source: qudt
    uri: http://qudt.org/vocab/unit/REV-PER-MIN
    relation: unit
    status: verified
    note: Revolution per minute; kept locally, not converted to the QUDT radian-per-second reference.
  individual_product:
    source: goodrelations
    uri: http://purl.org/goodrelations/v1#Individual
    relation: reference
    status: verified
    note: An identified actual product instance; never inferred from a model catalog record.
  make_and_model:
    source: goodrelations
    uri: http://purl.org/goodrelations/v1#hasMakeAndModel
    relation: reference
    status: verified
    note: Links an explicitly identified physical item to its product model.
  quantity_value:
    source: qudt
    uri: http://qudt.org/schema/qudt/QuantityValue
    relation: reference
    status: verified
    note: Quantity node containing a numeric value and unit.
  numeric_value:
    source: qudt
    uri: http://qudt.org/schema/qudt/numericValue
    relation: reference
    status: verified
    note: Numeric magnitude of a quantity value.
  quantity_kind:
    source: qudt
    uri: http://qudt.org/schema/qudt/hasQuantityKind
    relation: reference
    status: verified
    note: Quantity value relationship to the kind of measured quantity.
  quantity_unit:
    source: qudt
    uri: http://qudt.org/schema/qudt/hasUnit
    relation: reference
    status: verified
    note: Current QUDT 3.5.2 unit relationship inherited by QuantityValue from Quantifiable; verified on the hasUnit page and official overview.
  voltage_quantity:
    source: qudt
    uri: http://qudt.org/vocab/quantitykind/Voltage
    relation: reference
    status: verified
    note: Quantity kind for rated voltage.
  power_quantity:
    source: qudt
    uri: http://qudt.org/vocab/quantitykind/Power
    relation: reference
    status: verified
    note: Quantity kind for rated power.
  speed_quantity:
    source: qudt
    uri: http://qudt.org/vocab/quantitykind/RotationalFrequency
    relation: reference
    status: verified
    note: Shaft revolutions per time; QUDT explicitly lists REV-PER-MIN as an applicable unit of RotationalFrequency. Not a radian-per-second value.
  mass_quantity:
    source: qudt
    uri: http://qudt.org/vocab/quantitykind/Mass
    relation: reference
    status: verified
    note: Quantity kind for the legacy weight field, whose meaning is product mass rather than force.
  length_quantity:
    source: qudt
    uri: http://qudt.org/vocab/quantitykind/Length
    relation: reference
    status: verified
    note: Quantity kind for bearing dimensions.
