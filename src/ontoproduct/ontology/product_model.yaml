# Project-authored application ontology. Requiredness is a registration policy,
# not an existential OWL claim about every motor or bearing in the world.
# All concepts are defined here under the local namespace. External standards were
# design references only; their URIs and URLs live in docs, never in this file.
namespace: 'urn:ontoproduct:ontology:'
version: '3.0.0'
sources:
  iof-202603:
    title: IOF Core ontology
    version: '202603'
    license: MIT
    attribution: IOF Core Working Group / Industrial Ontologies Foundry / Open Applications Group
    usage: Design reference for physical artifacts and organizations. Definitions here are project-authored.
  goodrelations-1.0:
    title: GoodRelations vocabulary
    version: '1.0, release 2011-10-01'
    license: CC-BY-3.0
    attribution: Martin Hepp
    usage: Design reference for product models, business entities and model-item links. Definitions here are project-authored.
  qudt-3.5.2:
    title: QUDT quantities, units and dimensions
    version: '3.5.2'
    license: CC-BY-4.0
    attribution: QUDT.org
    usage: Design reference for quantity values, quantity kinds and units. Definitions and conversion multipliers here are project-authored.
measurement:
  sources: [qudt-3.5.2]
  quantity_value:
    name: QuantityValue
    label: Quantity value
    description: A value node holding exactly one numeric magnitude together with its unit and quantity kind.
  quantity_kind:
    name: QuantityKind
    label: Quantity kind
    description: A kind of measurable physical quantity, such as power or length, described by its SI base dimensions.
  unit:
    name: Unit
    label: Unit of measure
    description: A unit in which one quantity kind is expressed, with a conversion multiplier to the project canonical unit.
  numeric_value:
    name: numericValue
    label: Numeric value
    description: The numeric magnitude of a quantity value, expressed in its stated unit.
  has_unit:
    name: hasUnit
    label: Has unit
    description: Connects a quantity value to the unit of its numeric magnitude.
  has_quantity_kind:
    name: hasQuantityKind
    label: Has quantity kind
    description: Connects a quantity value to the kind of physical quantity it measures.
entity_classes:
  PhysicalArtifact:
    label: Physical artifact
    description: A material object produced by intentional human activity. Upper concept for identified physical items.
    sources: [iof-202603]
  Organization:
    label: Organization
    description: An entity separately known to be an organized group with a shared purpose; never inferred from a name string.
    sources: [iof-202603]
  BusinessEntity:
    label: Business entity
    description: A party that makes, offers or supplies products or services. A name alone does not identify it globally.
    sources: [goodrelations-1.0]
  ProductModel:
    label: Product model
    description: A catalog specification for a manufactured product model, not an individual physical item.
    sources: [goodrelations-1.0]
  ManufacturedItem:
    label: Manufactured physical item
    description: An explicitly identified individual physical artifact; a catalog entry does not establish its existence.
    parents: [PhysicalArtifact]
    sources: [iof-202603, goodrelations-1.0]
  Manufacturer:
    label: Manufacturer entity
    description: A business entity responsible for producing a model; a name alone does not identify it globally.
    parents: [BusinessEntity]
    sources: [goodrelations-1.0]
  ManufacturerOrganization:
    label: Manufacturer organization
    description: A manufacturer separately known to be an organization; never inferred from a name string.
    parents: [Manufacturer, Organization]
    sources: [iof-202603]
relations:
  hasManufacturer:
    label: Has manufacturer
    description: Connects a product model to its scoped manufacturer entity.
    domain: ProductModel
    range: Manufacturer
    sources: [goodrelations-1.0]
  hasMakeAndModel:
    label: Has make and model
    description: Connects an explicitly identified manufactured item to its catalog model.
    domain: ManufacturedItem
    range: ProductModel
    sources: [goodrelations-1.0]
classes:
  Product:
    label: Manufactured product model
    description: Root application profile for catalog model registration.
    model_class: CatalogProductModel
    item_class: CatalogProductItem
  ElectricalPart:
    parent: Product
    label: Electrical part model
    description: Model of a component whose intended use involves electrical behavior.
    model_class: ElectricalPartModel
    item_class: ElectricalPartItem
  Motor:
    parent: ElectricalPart
    label: Motor model
    description: Model of an electrical component intended to convert electrical energy into mechanical motion.
    model_class: MotorModel
    item_class: MotorItem
    required: [manufacturer]
  BLDCMotor:
    parent: Motor
    label: Brushless DC motor model
    description: Model of a brushless electronically commutated DC motor. Numeric specifications alone do not prove brushless construction.
    model_class: BLDCMotorModel
    item_class: BLDCMotorItem
    required: [rated_voltage, rated_power, rated_speed]
    optional: [weight]
  MechanicalPart:
    parent: Product
    label: Mechanical part model
    description: Model of a component whose intended use primarily involves mechanical behavior.
    model_class: MechanicalPartModel
    item_class: MechanicalPartItem
  Bearing:
    parent: MechanicalPart
    label: Bearing model
    description: Model of a mechanical component supporting relative motion, registered with inner and outer diameters.
    model_class: BearingModel
    item_class: BearingItem
    required: [inner_diameter, outer_diameter]
properties:
  manufacturer:
    label: Manufacturer
    description: Legacy name string projected into a scoped Manufacturer entity, with no global identity assertion.
    kind: entity
    predicate: hasManufacturer
    domain: ProductModel
    definition: {type: string}
  rated_voltage:
    label: Rated voltage
    description: Manufacturer-specified operating voltage for the model, expressed as a quantity value.
    kind: quantity
    predicate: ratedVoltage
    domain: BLDCMotorModel
    quantity: electric_potential
    definition: {type: number, canonical_unit: V, units: [V], minimum: 0}
  rated_power:
    label: Rated power
    description: Rated power specified in the source. Input versus shaft output power is not inferred without explicit evidence.
    kind: quantity
    predicate: ratedPower
    domain: BLDCMotorModel
    quantity: power
    definition: {type: number, canonical_unit: W, units: [W, kW], minimum: 0}
  rated_speed:
    label: Rated shaft speed
    description: Manufacturer-specified shaft revolutions per time, modeled as rotational frequency and kept in rpm locally.
    kind: quantity
    predicate: ratedSpeed
    domain: BLDCMotorModel
    quantity: rotational_frequency
    definition: {type: number, canonical_unit: rpm, units: [rpm], minimum: 0}
  weight:
    label: Product mass
    description: The legacy weight field means mass in kg, not gravitational force or weight in newtons.
    kind: quantity
    predicate: mass
    domain: BLDCMotorModel
    quantity: mass
    definition: {type: number, canonical_unit: kg, units: [g, kg], minimum: 0}
  inner_diameter:
    label: Bearing inner diameter
    description: Nominal diameter of the bearing bore.
    kind: quantity
    predicate: innerDiameter
    domain: BearingModel
    quantity: length
    definition: {type: number, canonical_unit: mm, units: [mm], minimum: 0}
  outer_diameter:
    label: Bearing outer diameter
    description: Nominal outside diameter, required to exceed the inner diameter for this registration profile.
    kind: quantity
    predicate: outerDiameter
    domain: BearingModel
    quantity: length
    definition: {type: number, canonical_unit: mm, units: [mm], minimum: 0}
classification_rules:
  - product_class: Bearing
    all_of: [inner_diameter, outer_diameter]
    none_of: [rated_voltage, rated_power, rated_speed]
  - product_class: Motor
    all_of: [manufacturer]
    any_of: [rated_voltage, rated_power, rated_speed]
    minimum_matches: 2
    none_of: [inner_diameter, outer_diameter]
    candidate_refinements: {BLDCMotor: BLDCMotor}
comparisons:
  - product_class: Bearing
    left: inner_diameter
    right: outer_diameter
    operator: less_than
