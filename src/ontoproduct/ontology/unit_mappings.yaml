# Shared unit catalog for business normalization and RDF export.
# Multipliers convert to the project canonical unit of the same quantity kind.
# Labels and descriptions are project-authored; source ids refer to product_model.yaml sources.
units:
  V: {quantity: electric_potential, canonical: V, multiplier: 1.0, label: volt, sources: [qudt-3.5.2]}
  W: {quantity: power, canonical: W, multiplier: 1.0, label: watt, sources: [qudt-3.5.2]}
  kW: {quantity: power, canonical: W, multiplier: 1000.0, label: kilowatt, sources: [qudt-3.5.2]}
  rpm: {quantity: rotational_frequency, canonical: rpm, multiplier: 1.0, label: revolution per minute, sources: [qudt-3.5.2]}
  kg: {quantity: mass, canonical: kg, multiplier: 1.0, label: kilogram, sources: [qudt-3.5.2]}
  g: {quantity: mass, canonical: kg, multiplier: 0.001, label: gram, sources: [qudt-3.5.2]}
  mm: {quantity: length, canonical: mm, multiplier: 1.0, label: millimetre, sources: [qudt-3.5.2]}
property_quantities:
  rated_voltage: electric_potential
  rated_power: power
  rated_speed: rotational_frequency
  weight: mass
  inner_diameter: length
  outer_diameter: length
quantity_definitions:
  electric_potential:
    label: Electric potential difference
    description: Voltage between two points; used for rated voltage.
    dimension: {mass: 1, length: 2, time: -3, current: -1}
    sources: [qudt-3.5.2]
  power:
    label: Power
    description: Rate of energy transfer. Input versus shaft output power is not distinguished without explicit evidence.
    dimension: {mass: 1, length: 2, time: -3}
    sources: [qudt-3.5.2]
  rotational_frequency:
    label: Rotational frequency
    description: Revolutions of a rotating shaft per unit time; kept in rpm and not converted to angular velocity in rad/s.
    dimension: {time: -1}
    sources: [qudt-3.5.2]
  mass:
    label: Mass
    description: Amount of matter, in kilograms; not gravitational force.
    dimension: {mass: 1}
    sources: [qudt-3.5.2]
  length:
    label: Length
    description: A linear dimension such as a bearing diameter.
    dimension: {length: 1}
    sources: [qudt-3.5.2]
